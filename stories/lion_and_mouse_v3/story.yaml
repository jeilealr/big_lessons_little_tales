# The Lion and the Mouse v3 -- the owner's dialogue script (script_dialog_en.txt)
# with the owner-made v3 images (character/characters/*/v3, character/locations).
# Every shot starts, and where possible ends, on an owner-made image or a
# composition of one onto a plate (v2 review: shots the model had to draw went
# off-model). Paths starting with ../../../ are relative to
# work/stories/lion_and_mouse_v3/ and point into the repo.
title: The Lion and the Mouse
slug: lion_and_mouse_v3
moral: Kindness does not create a debt. It creates more kindness.
source_text: stories/lion_and_mouse_v3/script_dialog_en.txt
style: handcrafted wool-felt stop-motion storybook miniature, softly stuffed matte felt forms, tactile
  fuzzy wool fibres, delicate visible stitching, charming handmade irregularities, bright warm children's
  storybook colours, soft warm light, shallow depth of field, miniature diorama photography, wholesome
  and gentle atmosphere
negative: plastic, glossy CGI, realistic animal fur, photorealistic animals, scary expression, angry face,
  visible teeth, fangs, sharp claws, roaring, clothing, text, letters, logo, watermark, subtitles, modern
  objects, people, deformed, extra limbs, extra tails, duplicate character, flickering, jittery motion,
  blurry, low quality, overexposed
voices:
  narrator: narrators/moonlight_storyteller_1
  leo: cast/leo
  milo: cast/milo
characters:
  leo:
    name: Leo the lion
    role: main
    canonical: character/characters/Leo/v3/canonical/full-body_leo_neutral_pose.png
    dna: character/characters/Leo/v3/dna.yaml
    sheet: a handcrafted needle-felted lion with a compact sturdy warm golden-ochre body with delicate
      stitched seams, short thick legs, oversized rounded pale-tan paws with stitched toes, a pale-cream
      chest patch, and a very large round rust-red mane of long pointed fuzzy wool locks framing his face;
      large round dark-brown eyes with cream whites, short curved brown brows, a small dark-brown nose
      on a soft peach-pink bridge, a broad pale-cream muzzle with tiny whisker dots and fine pale whiskers,
      a subtle stitched smile, small rounded ears with pink inner felt, and a long golden tail ending
      in a rust-red tuft
    personality: strong, warm, wise, gentle; surprised or worried at most, never threatening
    anatomy: quadrupedal; stands and walks on all four paws
  milo:
    name: Milo the mouse
    role: main
    canonical: character/characters/Milo/v3/canonical/full-body_milo_neutral_pose.png
    dna: character/characters/Milo/v3/dna.yaml
    sheet: a small handcrafted wool-felt mouse with a slender warm taupe-grey body with delicate stitched
      seams, a long pale-cream belly, a large round head with a small tuft of rust-orange wool hair on
      top, two very large round upright ears with coral-pink inner felt and stitched grey rims, very large
      round dark-brown eyes with cream whites, small curved brown brows, a tiny dark-brown nose, a pale-cream
      muzzle with a small stitched smile and long fine pale whiskers, slim arms and legs with tiny rounded
      paws, and a long thin pinkish-taupe tail
    personality: small, clever, curious, optimistic, quietly brave; never helpless
    anatomy: upright; stands and walks on two feet
locations:
  stream_bank:
    name: stream bank
    sheet: a sunny felt forest meadow by a felt stream with berry bushes, rounded felt trees and grass
  fork:
    name: fork
    sheet: a felt forest path splitting in two at sunset, a sunny meadow path and a darker forest path
  shortcut:
    name: shortcut
    sheet: a mossy felt forest path at dusk with a mossy stone, a fallen branch and an old tree stump
  great_tree:
    name: great tree
    sheet: a great old felt tree with a wide stitched trunk and big roots beside a meadow and a stream
  distant_forest:
    name: distant forest
    sheet: a quiet felt forest path with red and green felt leaves, rounded grey rocks and tall trees
      in warm morning light
  forest_run:
    name: forest run
    sheet: a felt forest floor with big roots, ferns, a fallen branch and morning light
props:
  net: a hunter's net of soft braided cream craft rope with large square gaps and chunky round knots
