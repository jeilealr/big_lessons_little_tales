# Location DNA for The Lion and the Mouse v3 (draft 2026-09-27, for owner review).
# Like the character DNA: the frozen description of each place, what must never
# change, and the images (plates) the owner generates for it. The canonical
# plate is the identity authority; text follows the image.
#
# Why (v2 review): backgrounds changed whenever a shot saw more of a place than
# its plate showed (camera moves, crops, continuations). So shots stay inside
# the plate (fixed camera or push-ins; close-ups are crops of the plate).
# Owner decision 2026-09-28: ONE normal-height view per place (plus a plate per
# lighting); no low mouse-eye angles (they were not good or stable, and the v2
# videos already showed Leo and Milo at a good relative size in normal views).
#
# Rules for every plate (for the image tool):
# - Empty: no characters, no animals, no net, unless the entry says so.
# - 16:9 (1920x1080 or 1344x768), the scene filling the frame edge to edge; no
#   studio table, backdrop or border.
# - Same style for all: handcrafted wool-felt stop-motion storybook miniature,
#   matte felt, visible stitching, rounded shapes; the same world as Leo and
#   Milo (same felt, same palette family).
# - Leave the stage area (where characters stand or travel) open, flat and in
#   focus; mark nothing on it.
# - Each lighting state is its own plate set (never ask the video model to
#   change time of day).
# Files: character/locations/<id>/<id>_<angle>_<light>.png  (e.g.
#   character/locations/lion_and_mouse_v3/stream_bank/stream_bank_wide_afternoon.png)

style: >-
  handcrafted wool-felt stop-motion storybook miniature, matte felt surfaces,
  visible delicate stitching, rounded soft shapes, charming handmade
  irregularities, warm children's storybook palette, miniature diorama
  photography with shallow depth of field

scale_note: >-
  Milo is one third of Leo's standing height. Both share the same normal-height
  plates; close-ups of Milo are crops of the plate (production/keyframe.py).

locations:
  stream_bank:
    role: Milo's feeding ground at the edge of the forest (opening beats 1-3)
    dna: >-
      a gentle felt stream of layered blue and teal felt with small white
      stitched ripples, low berry bushes with round red felt berries, tall
      soft green felt grass tufts, a few acorns on the ground, a hollow felt log
      on the bank, rounded felt trees behind
    never_change: [the stream running left-to-right in the wide plate, the hollow log on the right bank, red-berry bushes on the near bank]
    lighting: {afternoon: warm golden afternoon light from the left, sunset: low orange sun, long soft shadows, sky turning pink}
    plates:
      - {angle: wide, light: afternoon, file: stream_bank_wide_afternoon.png, purpose: establishing, Milo exploring and eating}
      - {angle: wide, light: sunset, file: stream_bank_wide_sunset.png, purpose: "Oh! It's getting late!"}
  fork:
    role: where the safe path and the shortcut split (beats 4-6)
    dna: >-
      a felt path splitting in two: the left path curves around a sunny open
      meadow with small flowers; the right path goes straight into a darker,
      quieter part of the forest with tall close-set felt trees
    never_change: [safe path LEFT, shortcut RIGHT, a small felt signpost-free fork (no text anywhere)]
    lighting: {sunset: low orange sun, first blue dusk in the shortcut side}
    plates:
      - {angle: wide, light: sunset, file: fork_wide_sunset.png, purpose: the choice between the two paths}
  shortcut:
    role: the quiet forest path Milo races through (beats 7-8)
    dna: >-
      a narrow mossy felt path under tall dark-green felt trees, a mossy felt
      stone, a fallen felt branch across the path, an old stitched tree stump,
      dusky blue-orange light between the trunks
    never_change: [the three obstacles in this order along the path - stone, branch, stump]
    lighting: {dusk: blue dusk with the last orange light}
    plates:
      - {angle: side_track, light: dusk, file: shortcut_side_track_dusk.png, purpose: Milo running left-to-right past the obstacles}
  great_tree:
    role: Leo's favourite shady tree, where he sleeps; the accident, the release, the ending (beats 9-17, 35-37)
    dna: >-
      a great old felt tree with a wide stitched brown trunk and big exposed
      roots, a rounded canopy of layered green felt leaves, soft felt grass,
      the shortcut path running right past the trunk, a few small white felt
      flowers
    never_change: [trunk on the right, the path crossing left-to-right in front of the trunk, the big root on the left of the path]
    lighting: {dusk: blue dusk, warm last light on the canopy, the first stars appearing, day: warm midday light for the ending}
    plates:
      - {angle: wide, light: dusk, file: great_tree_wide_dusk.png, purpose: Leo asleep, the accident, the dialogue, the release}
      - {angle: sky, light: dusk, file: great_tree_sky_dusk.png, purpose: "Those stars you were worried about"}
      - {angle: wide, light: day, file: great_tree_wide_day.png, purpose: the ending, the two friends}
  milo_home:
    role: optional - Milo arriving home at nightfall (beat 18)
    dna: a small round felt burrow door among roots, a tiny felt lantern glow, first stars
    lighting: {night: deep blue, warm small light from the burrow}
    plates:
      - {angle: wide, light: night, file: milo_home_wide_night.png, purpose: Milo hurries home, carefully}
  distant_forest:
    role: where the net is set (beats 20-24)
    dna: >-
      a quieter, older part of the felt forest: tall rounded felt trees, green
      felt ferns, rounded grey felt rocks, a pale felt path, morning mist of
      soft white wool between the trunks
    never_change: [the path from lower-left to centre, the big grey rock on the right, ferns both sides]
    lighting: {morning: soft cool morning light, light mist}
    plates:
      - {angle: medium, light: morning, file: distant_forest_medium_morning.png, purpose: "the only view (owner, 2026-09-28): Leo walking in, the net, Milo's arrival, the gnawing, Leo free"}
  forest_run:
    role: Milo racing to the roar (beats 25-27)
    dna: >-
      a felt forest floor with big roots, low leafy bushes and low branches,
      morning light in shafts
    never_change: [roots in the foreground, bush middle, a low branch to run under]
    lighting: {morning: soft morning light shafts}
    plates:
      - {angle: side_track, light: morning, file: forest_run_side_track_morning.png, purpose: Milo running right-to-left over roots / under branches}
