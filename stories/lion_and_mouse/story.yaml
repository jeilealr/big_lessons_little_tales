# The Lion and the Mouse -- a felt-animal fable.
# The single source of truth for this story: style bible, characters,
# locations, scenes. Tools read it; nothing about the story is hard-coded.
title: The Lion and the Mouse
slug: lion_and_mouse
moral: >-
  No act of kindness is ever wasted, and even the smallest friend can be a
  great help.

# ---------------------------------------------------------------- style bible
# Appended to every prompt, verbatim, for every character, location and shot.
style: >-
  premium handcrafted stop-motion animation, everything made of soft wool felt
  and needle-felted fabric with visible wool fibres and tiny stitched details,
  rounded shapes, cosy children's storybook, soft warm lighting, shallow depth
  of field, miniature diorama photography, gentle cinematic camera movement,
  wholesome atmosphere, highly detailed wool texture
negative: >-
  plastic, realistic animal fur, photorealistic animals, scary expression,
  angry face, sharp teeth, text, letters, logo, watermark, subtitles, modern
  objects, people, deformed, extra limbs, extra tails, duplicate character,
  flickering, jittery motion, blurry, low quality, overexposed

# ---------------------------------------------------------------- characters
# `sheet` is the frozen description (step 1 of docs/character-consistency.md):
# pasted verbatim into every prompt the character appears in. Never reword it.
characters:
  leo:
    name: Leo the lion
    role: main
    trigger: twcleo
    lora: {name: leo, step: 500}       # chosen from the eval grid (docs/img/leo_milo_lora_grid.jpg)
    sheet: >-
      a large but lovable needle-felted lion with a golden-yellow felt body, a
      round head, a large fluffy burnt-orange wool mane, small rounded ears,
      warm brown stitched eyes, a dark brown triangular felt nose, a tiny
      stitched smile, short rounded legs, oversized soft felt paws, and a long
      golden tail with a brown wool tuft
    personality: powerful but friendly; surprised or amused, never angry or scary
    scale: about six times the height of Milo
  milo:
    name: Milo the mouse
    role: main
    trigger: twcmilo
    lora: {name: milo, step: 500}      # chosen from the eval grid (docs/img/leo_milo_lora_grid.jpg)
    sheet: >-
      a tiny adorable needle-felted mouse with a soft light-grey felt body, a
      cream-coloured belly, oversized round pink felt ears, tiny black stitched
      eyes, a small pink triangular nose, a thin pink felt tail, tiny rounded
      paws, and a sweet expressive face
    personality: cheerful, curious, sincere, brave when it matters
    scale: about one-sixth the height of Leo
  butterfly:
    name: the felt butterfly
    role: secondary
    sheet: >-
      a tiny felt butterfly with soft pastel-blue wings edged in cream
      stitching and a slim dark grey body
    note: Milo chases it in scene 2; it can flutter through any forest shot

# ---------------------------------------------------------------- locations
# Each location gets a canonical empty "plate" (no characters) in design, so
# every shot set there shares the same place.
locations:
  clearing:
    name: the forest clearing with Leo's tree
    sheet: >-
      a sunny handmade felt forest clearing: a large felt tree with a thick
      stitched brown trunk and layered green wool leaves, soft felt grass,
      tiny colourful fabric flowers, small felt mushrooms, layered wool bushes,
      sunlight filtering gently through the felt leaves, warm morning light
    scenes: [1, 2, 3, 4, 5]
  trap_site:
    name: another part of the forest, where the net falls
    sheet: >-
      a quieter part of the handmade felt forest in the afternoon: tall wool
      trees, stitched grey rocks, ferns made of layered green felt, a soft felt
      path, warmer golden afternoon light
    scenes: [6, 8, 9]
  berry_patch:
    name: Milo's berry patch
    sheet: >-
      a small corner of the felt forest with low felt bushes full of tiny round
      red felt berries, clover made of green felt, a few fabric flowers, soft
      afternoon light
    scenes: [7]

props:
  # Positive words only: "not frightening" in a prompt names what it negates.
  # Harmlessness is carried by the materials and by the design negative.
  net: >-
    a handmade net of soft braided cream craft rope with large square gaps
    and chunky round knots, loose and floppy like a knitted toy

# ---------------------------------------------------------------- scenes
# The brief, scene by scene (from the author's story treatment). Shots are
# broken out per scene as each one is worked on; `status` tracks progress.
scenes:
  1:
    title: The peaceful forest
    location: clearing
    characters: [leo]
    text: >-
      Wide establishing shot. A beautiful handmade felt forest during a warm
      sunny morning. Leo the lion sleeps peacefully beneath a large felt tree.
      Soft felt grass surrounds him with tiny colourful fabric flowers,
      mushrooms, butterflies and layered wool bushes. Sunlight filters gently
      through the felt leaves. The camera slowly moves toward the sleeping
      lion. Mood: peaceful, magical, safe and welcoming.
    status: first shot
    shots:
      - name: s01_establish
        superseded_by: s01_establish_v2   # 5101 woke up; kept for the record
        keyframe: keyframes/scene01_y0.78.png     # sleeping Leo composed into the clearing
        characters: [leo]
        frames: 81
        seeds: [5101, 5102]
        action: >-
          Wide establishing shot of a peaceful handmade felt forest on a warm sunny
          morning. The camera slowly and smoothly moves toward Leo the lion, who
          sleeps peacefully beneath the large felt tree with his eyes closed, his
          round belly gently rising and falling as he breathes. Two small pastel
          felt butterflies flutter slowly through the warm sunlight filtering
          through the felt leaves.
      - name: s01_establish_v2
        take: 5103                          # chosen render (the animatic uses it)
        keyframe: keyframes/scene01_y0.78.png
        characters: [leo]
        frames: 81
        seeds: [5103]
        # v1: in seed 5101 Leo opened his eyes and smiled at the camera
        action: >-
          Wide establishing shot of a peaceful handmade felt forest on a warm sunny
          morning. The camera slowly and smoothly moves closer to Leo the lion, who
          stays fast asleep beneath the large felt tree the whole time, his eyes
          closed, his round belly gently rising and falling as he breathes. Two small
          pastel felt butterflies flutter slowly through the warm sunlight.
        negative_extra: open eyes, awake, looking at the camera, standing up
  2:
    title: The little mouse appears
    location: clearing
    characters: [milo, butterfly]
    text: >-
      Milo happily runs through the felt grass. He explores flowers, climbs over
      small stitched rocks, and playfully chases a tiny felt butterfly. He does
      not notice the sleeping lion ahead. Low-angle camera following Milo
      through the miniature forest. His expression is cheerful and curious.
    shots:
      - name: s02_milo_runs
        superseded_by: s02_milo_runs_v2    # ran into depth; invented canopy
        keyframe: keyframes/scene02_milo.png      # Milo in a close-up of the clearing
        characters: [milo, butterfly]
        frames: 81
        seeds: [5201]
        action: >-
          Low-angle camera close to the ground, following Milo the tiny mouse as he
          happily runs to the left through the soft felt grass past fabric flowers,
          his big pink ears bouncing, playfully chasing a small pastel-blue felt
          butterfly that flutters just ahead of him. Cheerful and curious.
        negative_extra: lion, big animal, second mouse
      - name: s02_milo_runs_v2
        keyframe: keyframes/scene02_milo_v3.png   # left of the clearing: no tree, Milo larger
        compose:                                  # feet on the in-focus grass, not the mushrooms
          plate: design/clearing/canonical.png
          crop: [0.0, 0.46, 0.42]
          characters:
            - {still: characters/milo/poses/milo_turns_side_last.png, x: 0.66, y: 0.62, h: 0.36}
        characters: [milo, butterfly]
        frames: 81
        seeds: [5202, 5203]
        # v1: Milo turned his back and ran away into depth; the camera tilted up and
        # invented a different tree canopy; Leo's tree appeared without Leo.
        action: >-
          Seen from the side at ground level, Milo the tiny mouse runs quickly across
          the frame from right to left in a happy scamper through the soft felt grass,
          his big pink ears bouncing, chasing a small pastel-blue felt butterfly that
          flutters just ahead of him. The camera glides sideways alongside him at his
          height, keeping him in the centre of the frame. Cheerful and curious.
        negative_extra: >-
          lion, big animal, second mouse, running away from the camera, back view,
          mouse getting smaller, camera tilting up, tree trunk
      - name: s02_milo_runs_v2_lora        # A/B: same shot and seed with Milo's LoRA
        variant_of: s02_milo_runs_v2
        lora: true
        keyframe: keyframes/scene02_milo_v3.png
        compose:                                  # feet on the in-focus grass, not the mushrooms
          plate: design/clearing/canonical.png
          crop: [0.0, 0.46, 0.42]
          characters:
            - {still: characters/milo/poses/milo_turns_side_last.png, x: 0.66, y: 0.62, h: 0.36}
        characters: [milo, butterfly]
        frames: 81
        seeds: [5202]
        # v1: Milo turned his back and ran away into depth; the camera tilted up and
        # invented a different tree canopy; Leo's tree appeared without Leo.
        action: >-
          Seen from the side at ground level, Milo the tiny mouse runs quickly across
          the frame from right to left in a happy scamper through the soft felt grass,
          his big pink ears bouncing, chasing a small pastel-blue felt butterfly that
          flutters just ahead of him. The camera glides sideways alongside him at his
          height, keeping him in the centre of the frame. Cheerful and curious.
        negative_extra: >-
          lion, big animal, second mouse, running away from the camera, back view,
          mouse getting smaller, camera tilting up, tree trunk
  3:
    title: Oops!
    location: clearing
    characters: [leo, milo]
    text: >-
      Milo accidentally runs across Leo's enormous felt paw and climbs onto his
      mane. Leo suddenly wakes up. His eyes open wide. Milo freezes. Leo gently
      places one large paw in front of Milo, stopping him from running away.
      Leo looks surprised and slightly annoyed rather than angry. Milo looks
      nervous but adorable. Close-up showing the huge size difference.
    shots:
      - name: s03_leo_wakes
        take: 5302                          # eyes wide, 'o' mouth, Milo frozen; 5301 also fine
        keyframe: keyframes/scene03_wake.png      # both characters: first two-character test
        compose:
          plate: design/clearing/canonical.png
          crop: [0.25, 0.35, 0.5]
          characters:
            - {still: characters/leo/poses/leo_asleep.png, x: 0.5, y: 0.93, h: 0.62}
            - {still: characters/milo/canonical.png, x: 0.36, y: 0.97, h: 0.17}
        characters: [leo, milo]
        frames: 81
        seeds: [5301, 5302]
        action: >-
          Close-up at ground level. Leo the lion lies with his big front paws in
          front of him, and tiny Milo the mouse stands frozen on the grass right in
          front of Leo's paws. Leo slowly lifts his round head and opens his eyes wide
          in surprise, looking down at the tiny mouse. Milo stays perfectly still,
          nervous but adorable.
        negative_extra: >-
          angry face, teeth, roaring, scary, second lion, second mouse, mouse
          running away, lion standing up
      - name: s03_leo_wakes_lora            # A/B: the same shot and seed with both LoRAs
        variant_of: s03_leo_wakes
        lora: true
        keyframe: keyframes/scene03_wake.png
        characters: [leo, milo]
        frames: 81
        seeds: [5301]
        action: >-
          Close-up at ground level. Leo the lion lies with his big front paws in
          front of him, and tiny Milo the mouse stands frozen on the grass right in
          front of Leo's paws. Leo slowly lifts his round head and opens his eyes wide
          in surprise, looking down at the tiny mouse. Milo stays perfectly still,
          nervous but adorable.
        negative_extra: >-
          angry face, teeth, roaring, scary, second lion, second mouse, mouse
          running away, lion standing up
  4:
    title: The mouse makes a promise
    location: clearing
    characters: [leo, milo]
    text: >-
      Milo looks up at Leo and places his tiny paws together, sincere and
      hopeful. Milo says: "Please let me go. Maybe one day I can help you too."
      Leo looks surprised, then smiles kindly, amused. Leo lifts his paw and
      lets Milo go. Milo smiles gratefully. Warm sunlight falls across both.
    shots:
      - name: s04_milo_pleads
        keyframe: keyframes/scene04_from_s03.png
        continue_from: {shot: s03_leo_wakes, take: 5302}   # the cut continues Scene 3
        characters: [leo, milo]
        frames: 81
        seeds: [4101, 4102]
        # Milo is small in this frame: a push-in (reveals nothing new, Rule 2.8b)
        # makes his gesture readable; the gesture is the whole shot (Rule 2.1).
        action: >-
          The camera slowly moves closer to tiny Milo the mouse, who stands on the
          grass in front of Leo's big paws. Milo looks up at Leo and presses his
          tiny paws together in front of his chest, sincere and hopeful. Leo stays
          lying down, calm and curious.
        negative_extra: >-
          angry face, teeth, roaring, scary, second lion, second mouse, mouse
          running away, lion standing up, camera tilting up
      - name: s04_leo_smiles
        keyframe: keyframes/scene04_from_s03.png
        continue_from: {shot: s03_leo_wakes, take: 5302}
        characters: [leo, milo]
        frames: 81
        seeds: [4201, 4202]
        action: >-
          Leo the lion's surprised face softens into a big warm, kind smile, and he
          slowly nods his big round head, amused. Tiny Milo stands on the grass in
          front of his paws. The camera stays still.
        negative_extra: >-
          angry face, teeth, roaring, scary, open mouth, second lion, second mouse,
          mouse running away, lion standing up
  5:
    title: Kindness
    location: clearing
    characters: [leo, milo]
    text: >-
      Milo happily waves goodbye. Leo gives him a gentle smile. The little mouse
      disappears through the felt grass. Leo rests beneath the tree again.
      Camera slowly rises to show the beautiful felt forest.
    narration: >-
      Leo thought the little mouse could never help someone as big and strong
      as him. But he chose kindness.
  6:
    title: The trap
    location: trap_site
    characters: [leo]
    props: [net]
    text: >-
      Later that afternoon, Leo walks peacefully through another part of the
      felt forest. A handmade rope net drops over him and he is tangled beneath
      it. He tries gently to escape but cannot. His expression becomes worried.
      He lets out a loud roar for help. Wide cinematic shot of Leo trapped
      beneath the net among the felt trees.
    shots:
      - name: s06_leo_walks
        keyframe: keyframes/scene06_walk_v2.png   # Leo side-on on the path, facing right, room ahead
        compose:
          plate: design/trap_site/canonical.png
          characters:
            - {still: characters/leo/poses/leo_turns_side_last.png, x: 0.22, y: 0.88, h: 0.40, flip: true}
        characters: [leo]
        frames: 81
        seeds: [6101, 6102]
        # Rule 2.3: "walks slowly" did not travel (leo_walks); an energetic verb
        # and explicit side-on geometry with a tracking camera (Rule 2.10).
        action: >-
          Seen from the side, Leo the lion strides steadily along the soft felt path
          from left to right across the frame with big bouncy steps, his fluffy mane
          bobbing and his tufted tail swinging. The camera stays still. Peaceful and
          content.
        negative_extra: >-
          net, rope, mouse, second lion, walking away from the camera, back view,
          standing still, walking on the spot, camera tracking, lying down, sitting
  7:
    title: Milo hears the roar
    location: berry_patch
    characters: [milo]
    text: >-
      Far away, Milo is gathering tiny felt berries. He hears Leo's roar, raises
      his head, and his ears perk up. His expression changes from curiosity to
      concern. He drops the berries and runs toward the sound. Fast but playful
      tracking shot following the tiny mouse through the felt forest.
    shots:
      - name: s07_milo_hears
        keyframe: keyframes/scene07_run.png       # Milo side-on among the berries, facing left
        compose:
          plate: design/berry_patch/canonical.png
          characters:
            - {still: characters/milo/poses/milo_turns_side_last.png, x: 0.62, y: 0.84, h: 0.34}
        characters: [milo]
        frames: 81
        seeds: [7101, 7102]
        # Rule 2.1: a head raise does not register; turning the whole body does.
        action: >-
          Milo the tiny mouse stands among the felt berries. Suddenly he turns his
          whole body quickly to face the camera, startled, his big pink ears standing
          tall and his eyes wide with concern. The camera stays still at his height.
        negative_extra: >-
          lion, big animal, second mouse, running, crying, scary, eating
      - name: s07_milo_runs
        keyframe: keyframes/scene07_run.png
        characters: [milo]
        frames: 81
        seeds: [7201, 7202]
        # Scene 2 v2 (tracking camera, "keep him centred") gave a gliding camera
        # and a mouse bobbing on the spot. The pack clip that did run had a fixed
        # camera, so: fixed camera, and the run leaves the frame.
        action: >-
          Seen from the side at ground level, Milo the tiny mouse runs very fast
          across the frame from right to left along the felt forest floor and out
          of the left edge of the frame, his big pink ears streaming back, brave and
          determined. The camera stays still.
        negative_extra: >-
          lion, big animal, second mouse, butterfly, running away from the camera,
          back view, mouse getting smaller, standing still, hopping on the spot,
          camera tracking
  8:
    title: The little hero
    location: trap_site
    characters: [leo, milo]
    props: [net]
    text: >-
      Milo reaches Leo and sees him trapped. Leo looks surprised and relieved.
      Milo examines the rope net and nibbles through one rope with his tiny
      teeth; small fibres separate. Leo watches hopefully. The rope breaks, then
      another, until the opening is large enough for Leo to escape.
  9:
    title: Free!
    location: trap_site
    characters: [leo, milo]
    props: [net]
    text: >-
      Leo gently pushes the loose net aside and st...  (brief truncated here;
      remaining scenes to be added by the author)
