# Leo's pose library. His description, the style and the negative prompt come
# from ../story.yaml; this file only lists the poses to shoot. Every pose starts
# from his canonical design still, on the plain design backdrop, so it cuts out
# cleanly and can be placed into any location plate.
render:
  frames: 49          # 3 s at 16 fps: enough for one slow pose change, ~1 h per shot
shots:
  - name: leo_sleeps
    from: canonical
    seed: 701
    action: >-
      Leo slowly lies down on his belly, rests his round head on his big front
      paws and gently closes his eyes.
  - name: leo_turns_side
    from: canonical
    seed: 702
    action: >-
      Leo slowly turns his whole body to one side until his profile faces the
      camera, then holds still.
  - name: leo_turns_away
    from: canonical
    seed: 703
    action: >-
      Leo slowly turns around until his back, his mane from behind and his
      tufted tail face the camera, then holds still.
  # Round 7: actions the story needs (scenes 6, 9), which also widen the LoRA data
  - name: leo_walks
    from: leo_turns_side
    seed: 704
    action: >-
      Leo walks slowly and calmly forward on his short rounded legs, his big
      soft paws stepping one after another, his tufted tail swaying gently.
  - name: leo_sits
    from: canonical
    seed: 705
    action: >-
      Leo slowly sits down on his haunches, his front paws together in front of
      him, and settles with a gentle friendly smile.
