# The Lion and the Mouse, v2 -- the owner's retelling (2026-09-27), with the
# v2 character pack (character/characters/{Leo,Milo}/v2/).
# The single source of truth for this story. v1 (stories/lion_and_mouse/)
# stays as it was; nothing here refers to v1 assets except as lessons.
title: The Lion and the Mouse
slug: lion_and_mouse_v2
moral: >-
  Kindness does not create a debt. It creates more kindness.
source_text: stories/lion_and_mouse_v2/story.txt   # the owner's story text (copied from work/ so it is kept)

# ---------------------------------------------------------------- style bible
# Appended to every prompt, verbatim. Written to match the v2 character pack
# (Leo and Milo DNA "style" + the review frames' storybook forest).
style: >-
  handcrafted wool-felt stop-motion storybook miniature, softly stuffed matte
  felt forms, tactile fuzzy wool fibres, delicate visible stitching, charming
  handmade irregularities, bright warm children's storybook colours, soft warm
  light, shallow depth of field, miniature diorama photography, wholesome and
  gentle atmosphere
negative: >-
  plastic, glossy CGI, realistic animal fur, photorealistic animals, scary
  expression, angry face, visible teeth, fangs, sharp claws, roaring, clothing,
  text, letters, logo, watermark, subtitles, modern objects, people, deformed,
  extra limbs, extra tails, duplicate character, flickering, jittery motion,
  blurry, low quality, overexposed

# ---------------------------------------------------------------- characters
# `sheet`: the frozen description pasted into every prompt. From each
# character's dna.yaml `story_sheet_candidate`, corrected to what the canonical
# image shows (docs: prompting Rule 1.4). The canonical image is the authority.
characters:
  leo:
    name: Leo the lion
    role: main
    canonical: character/characters/Leo/v2/canonical/full-body_leo_neutral_pose_01.png
    dna: character/characters/Leo/v2/dna.yaml
    sheet: >-
      a handcrafted needle-felted lion with a compact sturdy warm golden-ochre
      body with delicate stitched seams, short thick legs, oversized rounded
      pale-tan paws with stitched toes, a pale-cream chest patch, and a very
      large round rust-red mane of long pointed fuzzy wool locks framing his
      face; large round dark-brown eyes with cream whites, short curved brown
      brows, a small dark-brown nose on a soft peach-pink bridge, a broad
      pale-cream muzzle with tiny whisker dots and fine pale whiskers, a subtle
      stitched smile, small rounded ears with pink inner felt, and a long golden
      tail ending in a rust-red tuft
    personality: strong, warm, wise, gentle; surprised or worried at most, never threatening
    anatomy: quadrupedal; stands and walks on all four paws
  milo:
    name: Milo the mouse
    role: main
    canonical: character/characters/Milo/v2/canonical/full-body_milo_neutral_pose_01.png
    dna: character/characters/Milo/v2/dna.yaml
    sheet: >-
      a small handcrafted wool-felt mouse with a slender warm taupe-grey body
      with delicate stitched seams, a long pale-cream belly, a large round head
      with a small tuft of rust-orange wool hair on top, two very large round
      upright ears with coral-pink inner felt and stitched grey rims, very large
      round dark-brown eyes with cream whites, small curved brown brows, a tiny
      dark-brown nose, a pale-cream muzzle with a small stitched smile and long
      fine pale whiskers, slim arms and legs with tiny rounded paws, and a long
      thin pinkish-taupe tail
    personality: small, clever, curious, optimistic, quietly brave; never helpless
    anatomy: upright; stands and walks on two feet
# Scale, fixed for every keyframe: Milo standing (to the top of his ears) is
# one third of Leo's standing height. v1 used one sixth, and Milo was too small
# for his gestures to register (prompting Rule 2.12).
scale:
  leo_standing: 1.0
  milo_standing: 0.33

# ---------------------------------------------------------------- locations
# Two recurring places, kept visually distinct; their fixed cues come from the
# review README. Each gets one empty v2 plate, reused by every shot there.
locations:
  clearing:
    name: the sunny clearing with Leo's tree
    sheet: >-
      a bright open handmade felt forest clearing in soft morning light: a
      grassy green felt floor with small white fabric flowers and a few red
      felt mushrooms, a broad hand-stitched brown felt tree trunk on the right
      with a rounded canopy of layered green felt leaves, rounded grey felt
      stones and leafy felt plants in the foreground, rounded wool trees in the
      distance and a pale blue sky with small cotton-wool clouds
    scenes: [1, 2, 3, 4, 5, 6, 12]
  trap_site:
    name: the forest path where the net falls
    sheet: >-
      a narrow pale felt path winding among tall rounded felt trees in the same
      handmade felt forest, green felt ferns and rounded grey felt rocks along
      the path, warm golden late-afternoon light
    scenes: [7, 9, 10, 11]
  forest_run:
    name: the forest between the two
    sheet: >-
      a handmade felt forest floor with soft green felt grass, leafy felt
      plants, small white fabric flowers and tall rounded felt trees, warm
      golden afternoon light
    scenes: [8]

props:
  net: >-
    a hunter's net of soft braided cream craft rope with large square gaps and
    chunky round knots

# ---------------------------------------------------------------- scenes
# `narration` is the owner's text for that beat (ElevenLabs reads it); `beat`
# is what the pictures must show. Shots are added as they are planned; see
# docs/production-guide.md section 7 and docs/prompting.md.
scenes:
  1:
    title: The sleeping lion
    location: clearing
    characters: [leo]
    narration: >-
      Once upon a time, a great lion was sleeping beneath a tree
    beat: Leo sleeps peacefully beneath his tree; the camera eases in.
    shots:
      - name: s01_sleeps
        take: 1101                          # push-in, Leo stays asleep, eyes closed
        keyframe: keyframes/s01_sleeps.png
        compose:
          plate: design/clearing/canonical.png
          characters:
            - {still: characters/leo/poses/leo_asleep.png, x: 0.58, y: 0.86, h: 0.34}
        characters: [leo]
        frames: 81
        seeds: [1101, 1102]
        action: >-
          Leo the lion lies fast asleep on the grass beneath the tree the whole
          time, his eyes closed, breathing slowly and peacefully. The camera slowly
          moves closer to him.
        negative_extra: >-
          open eyes, awake, looking at the camera, lifting the head, standing up,
          mouse
      - name: s01_sleeps_3q                # owner: 3/4 full body instead of the front view
        keyframe: keyframes/s01_sleeps_3q.png
        compose:
          plate: design/clearing/canonical.png
          characters:
            - {still: characters/leo/poses/leo_3q_asleep.png, x: 0.52, y: 0.87, h: 0.312}
        characters: [leo]
        frames: 81
        seeds: [1111, 1112, 1113]
        action: >-
          Leo the lion lies fast asleep on the grass beneath the tree the whole
          time, his eyes closed, breathing slowly and peacefully. The camera slowly
          moves closer to him.
        negative_extra: >-
          open eyes, awake, looking at the camera, lifting the head, standing up,
          mouse
  2:
    title: A little mouse
    location: clearing
    characters: [leo, milo]
    narration: >-
      when a little mouse accidentally ran across his paw.
    beat: Milo scampers across the grass, past Leo's big front paw, not noticing him.
    shots:
      - name: s02_milo_runs
        take: 2101                          # Milo scampers past and out right; Leo asleep
        keyframe: keyframes/s02_milo_runs.png
        compose:
          plate: design/clearing/canonical.png
          characters:
            - {still: characters/leo/poses/leo_asleep.png, x: 0.58, y: 0.86, h: 0.34}
            - {still: characters/milo/pack/actions__milo_action_walking_01.png, x: 0.12, y: 0.95, h: 0.17}
        characters: [leo, milo]
        frames: 81
        seeds: [2101, 2102]
        # Fixed camera + an energetic verb + the run leaves the frame (Rule 2.10).
        action: >-
          Seen from the side, tiny Milo the mouse runs quickly across the grass from
          left to right, right in front of the sleeping lion's big front paws, and
          out of the right edge of the frame. Leo stays fast asleep the whole time,
          his eyes closed. The camera stays still.
        negative_extra: >-
          open eyes, awake, lion standing up, second mouse, running away from the
          camera, back view, standing still, camera moving
      - name: s02_milo_runs_3q
        keyframe: keyframes/s02_milo_runs_3q.png
        compose:
          plate: design/clearing/canonical.png
          characters:
            - {still: characters/leo/poses/leo_3q_asleep.png, x: 0.52, y: 0.87, h: 0.312}
            - {still: characters/milo/pack/actions__milo_action_walking_01.png, x: 0.12, y: 0.95, h: 0.17}
        characters: [leo, milo]
        frames: 81
        seeds: [2111, 2112, 2113]
        action: >-
          Seen from the side, tiny Milo the mouse runs quickly across the grass from
          left to right, right in front of the sleeping lion's big front paws, and
          out of the right edge of the frame. Leo stays fast asleep the whole time,
          his eyes closed. The camera stays still.
        negative_extra: >-
          open eyes, awake, lion standing up, second mouse, running away from the
          camera, back view, standing still, camera moving
  3:
    title: Caught
    location: clearing
    characters: [leo, milo]
    narration: >-
      The lion woke with a growl and caught the mouse beneath his paw.
    beat: >-
      Leo wakes, surprised; he gently places one big paw beside Milo as a soft
      barrier (never on top of him, no teeth: the "growl" is the narrator's).
    shots:
      # Start and end keyframes: the same crop, the same place; only Leo's pose
      # changes (asleep -> lying awake, sphinx). Milo stays frozen at his paws.
      - name: s03_caught
        take: 3101                          # wakes surprised, swings a paw down beside Milo
        keyframe: keyframes/s03_start.png
        compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_asleep.png, x: 0.577, y: 0.769, h: 0.654}
            - {still: characters/milo/poses/milo_worried_last.png, x: 0.25, y: 0.93, h: 0.327}
        end_keyframe: keyframes/s03_end.png
        end_compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_sphinx.png, x: 0.577, y: 0.769, h: 0.692}
            - {still: characters/milo/poses/milo_worried_last.png, x: 0.25, y: 0.93, h: 0.327}
        characters: [leo, milo]
        frames: 81
        seeds: [3101, 3102]
        action: >-
          Leo the lion wakes up with a start, lifts his big head and opens his eyes
          wide in surprise, looking at the tiny mouse right beside his paws, and
          stretches one big front paw forward onto the grass next to him. Tiny Milo
          freezes, worried. The camera stays still.
        negative_extra: >-
          teeth, open mouth, angry face, roaring, lion standing up, mouse running
          away, second lion, second mouse, camera moving
      - name: s03_caught_3q
        keyframe: keyframes/s03_start_3q.png
        compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_3q_asleep.png, x: 0.46, y: 0.788, h: 0.60}
            - {still: characters/milo/poses/milo_worried_last.png, x: 0.66, y: 0.97, h: 0.34}
        end_keyframe: keyframes/s03_end_3q.png
        end_compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_3q_sphinx.png, x: 0.46, y: 0.788, h: 0.694}
            - {still: characters/milo/poses/milo_worried_last.png, x: 0.66, y: 0.97, h: 0.34}
        characters: [leo, milo]
        frames: 81
        seeds: [3111, 3112, 3113]
        action: >-
          Leo the lion wakes up with a start, lifts his big head and opens his eyes
          wide in surprise, looking at the tiny mouse right beside his paws, and
          stretches one big front paw forward onto the grass next to him. Tiny Milo
          freezes, worried. The camera stays still.
        negative_extra: >-
          teeth, open mouth, angry face, roaring, lion standing up, mouse running
          away, second lion, second mouse, camera moving
  4:
    title: The lion decides
    location: clearing
    characters: [leo, milo]
    narration: >-
      The mouse trembled, but the lion looked at the tiny creature and realized
      there was no reason to hurt him.
    beat: Close-up of Milo, worried; close-up of Leo, whose look softens from surprise to kindness.
    shots:
      # Close-ups from the owner's expression images (identical framing), as
      # start and end frames: the guide's two-frame method.
      - name: s04_milo_trembles
        take: 4101                          # on-model throughout, gentle worried quiver
        keyframe: keyframes/s04_milo_concerned.png
        compose:
          plate: design/clearing/canonical.png
          blur: 14
          characters:
            - {still: characters/milo/pack/expressions__milo_expression_concerned_01.png, x: 0.5, y: 1.08, h: 1.05}
        end_keyframe: keyframes/s04_milo_concerned.png
        characters: [milo]
        frames: 81
        seeds: [4101]
        action: >-
          Close-up of tiny Milo the mouse looking up, worried; he trembles a little,
          his big ears quivering and his whiskers twitching, mouth closed. The
          camera stays still.
        negative_extra: >-
          lion, second mouse, open mouth, teeth, crying, tears, running, camera
          moving
      - name: s04_leo_softens
        superseded_by: s04_leo_softens_v2   # background wandered mid-shot (tree drawn in)
        keyframe: keyframes/s04_leo_curious.png
        compose:
          plate: design/clearing/canonical.png
          blur: 14
          characters:
            - {still: characters/leo/pack/expressions__leo_expression_curious_01.png, x: 0.5, y: 1.08, h: 1.05}
        end_keyframe: keyframes/s04_leo_smile.png
        end_compose:
          plate: design/clearing/canonical.png
          blur: 14
          characters:
            - {still: characters/leo/pack/expressions__leo_expression_smile_01.png, x: 0.5, y: 1.08, h: 1.05}
        characters: [leo]
        frames: 81
        seeds: [4201, 4202]
        action: >-
          Close-up of Leo the lion looking down curiously; slowly his face softens
          into a gentle, kind closed-mouth smile. The camera stays still.
        negative_extra: >-
          mouse, second lion, open mouth, teeth, angry, roaring, camera moving
      - name: s04_leo_softens_v2           # close-up background instead of the location sheet
        take: 4203                          # curious -> kind smile; background stays soft
        keyframe: keyframes/s04_leo_curious.png
        end_keyframe: keyframes/s04_leo_smile.png
        background: >-
          a soft, completely out-of-focus sunny felt meadow with blurred green and
          pale blue shapes
        characters: [leo]
        frames: 81
        seeds: [4203, 4204]
        action: >-
          Close-up of Leo the lion looking down curiously; slowly his face softens
          into a gentle, kind closed-mouth smile. The camera stays completely
          still.
        negative_extra: >-
          mouse, second lion, open mouth, teeth, angry, roaring, camera moving,
          tree trunk, sharp background, cut, scene change
  5:
    title: Go on your way
    location: clearing
    characters: [leo, milo]
    narration: >-
      "You frightened me," said the lion, "but you meant no harm. Go on your
      way."
    beat: Leo lifts his paw away and smiles; Milo is free.
    shots:
      - name: s05_leo_releases
        superseded_by: s05_leo_nods          # 'draws his paw back' lifted the paw to his face
        keyframe: keyframes/s05_from_s03.png
        continue_from: {shot: s03_caught, take: 3101}
        characters: [leo, milo]
        frames: 81
        seeds: [5101, 5102]
        action: >-
          Leo the lion gently draws his big front paw back towards himself and gives
          the tiny mouse a warm, kind closed-mouth smile, lying calmly on the grass.
          Tiny Milo stands still, looking up at him. The camera stays still.
        negative_extra: >-
          teeth, open mouth, angry face, roaring, lion standing up, mouse running
          away, second lion, second mouse, camera moving
      - name: s05_leo_nods
        keyframe: keyframes/s05_from_s03.png
        continue_from: {shot: s03_caught, take: 3101}
        characters: [leo, milo]
        frames: 81
        seeds: [5103, 5104, 5105]
        action: >-
          Leo the lion keeps his big paws resting flat on the grass and gives the
          tiny mouse a warm, kind closed-mouth smile and a slow gentle nod, as if
          saying go on your way. Tiny Milo stands still, looking up at him. The
          camera stays still.
        negative_extra: >-
          raised paw, paw near the face, teeth, open mouth, angry face, roaring, lion
          standing up, mouse running away, second lion, second mouse, camera moving
  6:
    title: Thank you
    location: clearing
    characters: [leo, milo]
    narration: >-
      The mouse was surprised. He had expected anger, but instead the lion
      showed him kindness. "Thank you," said the mouse. "I hope one day I can
      show someone the same kindness."
    beat: Milo's surprise turns into a warm smile; he thanks Leo and scampers off.
    shots:
      - name: s06_milo_smiles
        take: 6101                          # surprise -> smile, clean
        keyframe: keyframes/s06_milo_surprise.png
        compose:
          plate: design/clearing/canonical.png
          blur: 14
          characters:
            - {still: characters/milo/pack/expressions__milo_expression_pleasant_surprise_01.png, x: 0.5, y: 1.08, h: 1.05}
        end_keyframe: keyframes/s06_milo_smile.png
        end_compose:
          plate: design/clearing/canonical.png
          blur: 14
          characters:
            - {still: characters/milo/pack/expressions__milo_expression_smile_01.png, x: 0.5, y: 1.08, h: 1.05}
        characters: [milo]
        frames: 81
        seeds: [6101]
        action: >-
          Close-up of tiny Milo the mouse looking up, surprised; his surprise turns
          into a warm, grateful smile, his big ears lifting. The camera stays
          still.
        negative_extra: >-
          lion, second mouse, teeth, crying, running, camera moving
      - name: s06_milo_thanks               # same two-shot crop as Scene 3; Milo worried -> paws together
        take: 6201                          # worried -> paws together, Leo smiling behind
        keyframe: keyframes/s06_thanks_start.png
        compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_sphinx.png, x: 0.577, y: 0.769, h: 0.692}
            - {still: characters/milo/poses/milo_worried_last.png, x: 0.25, y: 0.93, h: 0.327}
        end_keyframe: keyframes/s06_thanks_end.png
        end_compose:
          plate: design/clearing/canonical.png
          crop: [0.28, 0.46, 0.52]
          characters:
            - {still: characters/leo/poses/leo_sphinx.png, x: 0.577, y: 0.769, h: 0.692}
            - {still: characters/milo/poses/milo_paws_together_last.png, x: 0.25, y: 0.93, h: 0.327}
        characters: [leo, milo]
        frames: 81
        seeds: [6201, 6202]
        action: >-
          Tiny Milo the mouse looks up at the lion, relaxes, and presses his tiny paws
          together in front of his chest with a grateful smile, saying thank you.
          Leo the lion lies calmly behind him, smiling gently. The camera stays
          still.
        negative_extra: >-
          teeth, open mouth, angry face, lion standing up, mouse running away, second
          lion, second mouse, camera moving
      - name: s06_milo_leaves
        keyframe: keyframes/s06_from_thanks.png
        continue_from: {shot: s06_milo_thanks, take: 6201}
        characters: [leo, milo]
        frames: 81
        seeds: [6301, 6302, 6303]
        action: >-
          Tiny Milo the mouse turns and scampers happily away across the grass to
          the left and out of the left edge of the frame, while Leo the lion stays
          lying down, watching him go with a gentle smile. The camera stays still.
        negative_extra: >-
          angry face, teeth, open mouth, roaring, lion standing up, second lion,
          second mouse, camera moving
  7:
    title: The net
    location: trap_site
    characters: [leo]
    props: [net]
    narration: >-
      Some days later, the lion became trapped in a hunter's net. He pulled and
      struggled, but the ropes only tightened around him.
    beat: >-
      Leo walks the forest path; a soft rope net drops over him; he tugs at it,
      worried, mouth closed (mild peril: findings B6).
    shots:
      - name: s07_leo_walks
        take: 7101                          # walks along the path across the frame
        keyframe: keyframes/s07_walk.png
        compose:
          plate: design/trap_site/canonical.png
          characters:
            - {still: characters/leo/pack/actions__leo_action_walking_01.png, x: 0.28, y: 0.92, h: 0.44}
        characters: [leo]
        frames: 81
        seeds: [7101, 7102]
        # v1 Scene 6: a fixed camera + room ahead made Leo really walk.
        action: >-
          Seen from the side, Leo the lion strides steadily along the pale felt path
          from left to right across the frame with big bouncy steps, his mane
          bobbing and his tufted tail swinging. The camera stays still. Peaceful
          and content.
        negative_extra: >-
          net, rope, mouse, second lion, walking away from the camera, back view,
          standing still, walking on the spot, camera tracking, lying down
      - name: s07_net_falls
        take: 7202                          # net drapes over Leo lying calmly
        keyframe: keyframes/s07_from_walk.png
        continue_from: {shot: s07_leo_walks, take: 7101}
        characters: [leo]
        frames: 81
        seeds: [7201, 7202]
        # v1 wording that worked (s06_net_falls 6202); mild peril (findings B6).
        action: >-
          A soft handmade net of braided cream craft rope with large square gaps and
          chunky round knots gently drops from above and settles loosely over Leo the
          lion. Leo stops, lies down under the soft net and looks up, surprised and
          a little worried, his mouth closed. The camera stays still.
        negative_extra: >-
          scary, angry face, teeth, open mouth, roaring, crying, pain, metal, wire,
          chains, spikes, cage, mouse, second lion, people, hunter, camera moving
      - name: s07_leo_tugs
        keyframe: keyframes/s07_from_net.png
        continue_from: {shot: s07_net_falls, take: 7202}
        characters: [leo]
        frames: 81
        seeds: [7301, 7302, 7303]
        # Mild peril (findings B6): gentle tugging, worried, mouth closed; the
        # narrator carries "struggled"; no thrashing, no rope over the face.
        action: >-
          Leo the lion, lying under the soft rope net, gently tugs at the ropes with
          one big front paw and looks up, worried, his mouth closed. The net stays
          over him. The camera stays still.
        negative_extra: >-
          teeth, open mouth, roaring, angry face, crying, pain, thrashing, rope over
          the face, standing up, escaping, mouse, second lion, people, hunter,
          camera moving
  8:
    title: Milo hears
    location: forest_run
    characters: [milo]
    narration: >-
      The mouse heard his roars and hurried toward the sound.
    beat: Milo stops, ears up, turns towards the sound, and runs.
    shots:
      # The turn is pinned by start and end keyframes: 3/4 view -> side view
      # facing left (towards the sound). A head turn alone does not register.
      - name: s08_milo_hears
        take: 8101                          # turns to face the sound (start+end keyframes)
        keyframe: keyframes/s08_hears_start.png
        compose:
          plate: design/forest_run/canonical.png
          characters:
            - {still: characters/milo/pack/views__milo_view_3q_01.png, x: 0.58, y: 0.90, h: 0.40}
        end_keyframe: keyframes/s08_hears_end.png
        end_compose:
          plate: design/forest_run/canonical.png
          characters:
            - {still: characters/milo/pack/views__milo_view_side_01.png, x: 0.58, y: 0.90, h: 0.40, flip: true}
        characters: [milo]
        frames: 81
        seeds: [8101, 8102]
        action: >-
          Tiny Milo the mouse hears a far-away sound; his big ears lift and he turns
          his whole body towards the left, listening, alert and concerned. The
          camera stays still.
        negative_extra: >-
          lion, second mouse, running, open mouth, teeth, crying, camera moving
      - name: s08_milo_runs
        superseded_by: s08_milo_runs_v2     # walked off into depth (walking start still)
        keyframe: keyframes/s08_runs.png
        compose:
          plate: design/forest_run/canonical.png
          characters:
            - {still: characters/milo/pack/actions__milo_action_walking_01.png, x: 0.70, y: 0.90, h: 0.38, flip: true}
