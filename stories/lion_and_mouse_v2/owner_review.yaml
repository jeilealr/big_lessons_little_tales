# What the review shows (feeds v3; details in docs/prompting.md results log):
lessons:
  - Every shot where Wan had to DRAW Leo in a new state (inside the net,
    tugging, under the net at a distance, stepping free) went off-model.
    Shots that start AND end on owner-made images (close-ups from the
    expression set) were the best. v3 needs owner-made images of every new
    state, used as start and end keyframes.
  - Backgrounds drift whenever the camera sees more than the plate (camera
    moves, crops, continuations). v3 needs a location DNA and a plate for
    every camera angle used, not one plate per place.
  - Small characters in wide shots lose identity (Milo in s12, Leo small
    under the net). Keep each character large enough; use mouse-eye-level
    plates and close-ups.
  - Fast mode adds motion (sleeping Leo stirs); for still moments pin the end
    keyframe, or use the 40-step render.
  - Some 40-step renders the owner liked (s05_leo_releases_s5102,
    s06_milo_smiles_s6101); some identical close-ups had no motion at all
    (s04_milo_trembles): a start and end that are the same image freeze the
    shot.
