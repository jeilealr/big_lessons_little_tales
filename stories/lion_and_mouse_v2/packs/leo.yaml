# Leo v2: poses the story needs that the owner-made pack does not contain.
# Every pose starts from the v2 canonical (installed by production/install_pack.py)
# on the same warm off-white studio, so it cuts out cleanly (BiRefNet).
# Measured in v1: lying down / sleeping is reliable; head raises are not.
set: a warm off-white seamless studio floor and backdrop with a small soft ground shadow
render:
  frames: 49          # 3 s: one slow pose change
shots:
  - name: leo_sleeps
    from: canonical
    seed: 2701
    action: >-
      Leo slowly lies down on his belly, rests his big round head on his front
      paws and gently closes his eyes, peaceful and content.
    negative_extra: open eyes at the end, standing, sitting, open mouth
  - name: leo_lies_awake
    from: canonical
    seed: 2702
    action: >-
      Leo slowly lies down on his belly with his big front paws stretched out in
      front of him, keeping his head up and his eyes open, calm and gentle.
    negative_extra: closed eyes, sleeping, standing, open mouth
  # Round 2. leo_sleeps lay down but kept his big eyes OPEN in every frame, and
  # leo_lies_awake ended sitting with paw pads towards the camera.
  - name: leo_closes_eyes_a
    from: leo_sleeps           # its last frame: lying, head on paws, eyes open
    seed: 2711
    action: >-
      Leo slowly closes his big eyes and falls asleep, his eyelids shut tight,
      his head resting on his front paws, peaceful and content.
    negative_extra: open eyes, looking at the camera, lifting the head, standing
  - name: leo_closes_eyes_b
    from: leo_sleeps
    seed: 2712
    action: >-
      Leo's eyelids slowly droop and close, and he falls fast asleep with his eyes
      shut, resting his head on his front paws, breathing gently.
    negative_extra: open eyes, looking at the camera, lifting the head, standing
  - name: leo_sphinx_a
    from: canonical
    seed: 2721
    action: >-
      Leo slowly lies down on his belly like a sphinx, both front paws flat on
      the floor and pointing forward, his head up and his eyes open, calm and
      gentle.
    negative_extra: paw pads facing the camera, sitting, standing, closed eyes, open mouth
  - name: leo_sphinx_b
    from: canonical
    seed: 2722
    action: >-
      Leo slowly lies down on his belly like a sphinx, both front paws flat on
      the floor and pointing forward, his head up and his eyes open, calm and
      gentle.
    negative_extra: paw pads facing the camera, sitting, standing, closed eyes, open mouth
