# fox_v2: the same fox stills as `fox`, plus each full-body still cut out and
# composited into varied felt-forest plates, to stop the LoRA memorising the
# meadow. Everything else (steps, rank, lr, eval prompts) identical to `fox`,
# so the grids compare the effect of background diversity alone.
name: fox_v2
trigger: twcfox
identity: a small orange felt fox
setting: on a green felt meadow with felt hills and cotton clouds
style: handmade felt stop-motion animation
workdir: characters/fox
subject: {method: hue, hue: [5, 22], min_sat: 120}
composite:
  per_image: 2
  seed: 7
  plates:
    - {glob: "stories/lion_and_mouse/design/clearing/cand_*.png", caption: "in a sunny felt forest clearing with wool trees and felt mushrooms"}
    - {glob: "stories/lion_and_mouse/design/trap_site/cand_*.png", caption: "on a felt path between tall wool trees with stitched rocks and felt ferns"}
    - {glob: "stories/lion_and_mouse/design/berry_patch/cand_100[034].png", caption: "in a felt berry patch with clover and red felt berries"}
sources:
  - {image: canonical.png, pose: "standing, three-quarter view"}
  - {image: "angles/angle_*.png", pose: "standing, side view", crop: false}
  - clip: Intro/felt_test_work/shots/1280x720_16fps_seed1234_s40/01_fox_meadow_81f.mp4
    frames: [8, 40, 72]
    pose: "walking, side view"
  - {clip: shots/fox_sits.mp4, frames: [48, 64, 80], pose: "sitting, three-quarter view"}
  - {clip: shots/fox_looks_up.mp4, frames: [48, 80], pose: "standing, side view"}
  - {clip: shots/fox_turns_to_camera.mp4, frames: [64, 80], pose: "standing, front view facing the camera"}
  - {clip: shots/fox_turns_away.mp4, frames: [64, 80], pose: "standing, back view, tail toward the camera"}

eval:
  seed: 4242
  steps: 30
  baseline_identity: a small orange felt fox with a white felt chest edged in white running stitches,
    black felt legs and paws, glossy black bead eyes, a small black felt nose, pointed orange ears with
    white stitching along the inner edge, and a bushy orange tail with a white felt tip
  prompts:
  - sitting, front view facing the camera, full body, on a green felt meadow with felt hills and cotton
    clouds
  - standing, three-quarter view, full body, in a felt forest with tall wool trees and small felt mushrooms
  - walking, side view, full body, in a snowy felt village at night with warm lit felt windows
  - sleeping curled up, full body, on a knitted blanket in a cosy felt bedroom
