# Dataset for the felt-fox LoRA: the pipeline test before Leo and Milo.
name: fox
trigger: twcfox
identity: a small orange felt fox
setting: on a green felt meadow with felt hills and cotton clouds
style: handmade felt stop-motion animation
workdir: characters/fox          # relative to twc_video/work
subject: {method: hue, hue: [5, 22], min_sat: 120}    # OpenCV hue 0-180: orange felt
sources:
  - {image: canonical.png, pose: "standing, three-quarter view"}
  - {image: "angles/angle_*.png", pose: "standing, side view", crop: false}
  - clip: Intro/felt_test_work/shots/1280x720_16fps_seed1234_s40/01_fox_meadow_81f.mp4
    frames: [8, 40, 72]
    pose: "walking, side view"
  - {clip: shots/fox_sits.mp4, frames: [48, 64, 80], pose: "sitting, three-quarter view"}
  - {clip: shots/fox_looks_up.mp4, frames: [48, 80], pose: "head raised looking up, side view"}
  - {clip: shots/fox_turns_to_camera.mp4, frames: [64, 80], pose: "standing, front view facing the camera"}
  - {clip: shots/fox_turns_away.mp4, frames: [64, 80], pose: "standing, back view, tail toward the camera"}

# Evaluation: same seeds for every checkpoint and for the no-LoRA baseline.
# The first prompt is in-distribution; the others put the fox where he was
# never trained, which is what shows whether the LoRA learned the fox or the
# meadow. The baseline swaps "<trigger>, <identity>" for the full text sheet.
eval:
  seed: 4242
  steps: 30
  baseline_identity: >-
    a small orange felt fox with a white felt chest edged in white running
    stitches, black felt legs and paws, glossy black bead eyes, a small black
    felt nose, pointed orange ears with white stitching along the inner edge,
    and a bushy orange tail with a white felt tip
  prompts:
    - sitting, front view facing the camera, full body, on a green felt meadow with felt hills and cotton clouds
    - standing, three-quarter view, full body, in a felt forest with tall wool trees and small felt mushrooms
    - walking, side view, full body, in a snowy felt village at night with warm lit felt windows
    - sleeping curled up, full body, on a knitted blanket in a cosy felt bedroom
