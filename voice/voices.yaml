# What each role reads in the audition (English; from the Lion and the Mouse v2).
audition:
  narrator:
    - "Once upon a time, a great lion was sleeping beneath a tree, when a little mouse accidentally ran across his paw."
    - "Perhaps kindness was not something to be repaid like a debt. Perhaps it was something that could simply be passed on."
  leo:
    - "You frightened me, but you meant no harm. Go on your way."
    - "You helped me even though you did not have to."
  leo_young:
    - "You frightened me, but you meant no harm. Go on your way."
    - "You helped me even though you did not have to."
  milo_young:
    - "Thank you. I hope one day I can show someone the same kindness."
    - "I think I can help!"
  milo:
    - "Thank you. I hope one day I can show someone the same kindness."
    - "I think I can help!"

# Chatterbox settings for auditions and narration (their guidance: 0.5/0.5 is
# the default; more expressive = higher exaggeration, lower cfg).
chatterbox:
  exaggeration: 0.55
  cfg_weight: 0.5
  cfg_weight_other_language: 0.0   # reference in English, text in another language
  seed: 7
