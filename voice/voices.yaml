# Voice design for the channel's fables: licence-clean, original voices.
#
# How a voice is made (see voice/README.md):
#   1. design   Parler-TTS (Apache-2.0) turns a written description into a
#               ~10 s reference clip. Only generic descriptions: Parler's named
#               speakers are real audiobook readers and are never used.
#   2. audition Chatterbox multilingual (MIT) clones the reference and reads the
#               role's lines from the story, exactly as narration will be made.
#   3. pick     the chosen reference becomes the canonical voice, kept in the
#               repo at voice/cast/<role>/ (reference.wav + voice.yaml).
# The same reference then speaks every language (Chatterbox supports en, de,
# es, fr, ru and more), so Leo sounds like Leo in all of them.
#
# Descriptions follow Parler's vocabulary (gender, pitch, pace, expressiveness,
# recording quality). Positive words only (docs/prompting.md Rule 3.5).

reference_text: >-
  The morning sun rose slowly over the quiet forest. The birds began to sing,
  and a gentle breeze moved through the tall green trees. It was going to be a
  wonderful day.

roles:
